# Order on the phone: list → compare → "order through Kaniti" → the store's own
# site fills its cart here, in the WebView, and shows its cart page.
appId: com.litansh.kaniti
---
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: { text: "Continue|Close|המחלקות" }
    timeout: 120000
- tapOn: { text: "Continue", optional: true }
- tapOn: { text: "Close", optional: true }
- extendedWaitUntil:
    visible: { text: "המחלקות" }
    timeout: 45000
- tapOn: ".*רשימה"
- tapOn: { id: "list-input" }
- inputText: "חלב 3%"
- tapOn: { text: ".*הוסף ״.*״ כמו שכתבתם" }
- tapOn: { id: "list-input" }
- inputText: "לחם אחיד"
- tapOn: { text: ".*הוסף ״.*״ כמו שכתבתם" }
- tapOn: { id: "Done", optional: true }
- scroll
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "list-compare" }
    timeout: 10000
- tapOn: { id: "list-compare" }
- extendedWaitUntil:
    visible: { id: "order-now" }
    timeout: 120000
- tapOn: { id: "order-now" }
- extendedWaitUntil:
    visible: { text: ".*(ממלאים את הסל|הסל מוכן|פריט 1 מתוך|התחברו ל).*" }
    timeout: 30000
# Terminal state: the store's cart is ready, or (with no connected account) the
# store's own sign-in is shown so the person can complete it - both are correct.
- extendedWaitUntil:
    visible: { text: ".*(הסל מוכן|פריט 1 מתוך|כדי שנמלא את הסל).*" }
    timeout: 120000
