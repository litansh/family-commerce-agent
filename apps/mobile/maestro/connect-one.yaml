# One store's connect flow, up to its own sign-in screen. STORE = store id,
# LOGIN = regex of words the store's login shows (e-mail / password / code / phone).
appId: com.litansh.kaniti
---
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: { text: "Continue|Close|המחלקות" }
    timeout: 120000
- tapOn: { text: "Continue", optional: true }
- tapOn: { text: "Close", optional: true }
- extendedWaitUntil:
    visible: { text: "המחלקות" }
    timeout: 45000
- tapOn: ".*אני"
- assertVisible: "החנויות המחוברות"
- scrollUntilVisible:
    element: { id: "connect-${STORE}" }
    direction: DOWN
    timeout: 20000
- tapOn: { id: "connect-${STORE}" }
- extendedWaitUntil:
    visible: { text: "חיבור .*" }
    timeout: 15000
# The store's own sign-in must appear inside Kaniti.
- extendedWaitUntil:
    visible: { text: "${LOGIN}" }
    timeout: 60000
# ... and Kaniti must NOT decide we are connected on its own.
- assertNotVisible: { text: "החשבון ב.* מחובר.*" }
