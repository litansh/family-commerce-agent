# Screenshots of the compare screen's states for a design PR: the answer, a row unfolded, the drive rows.
appId: com.litansh.kaniti
---
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: { text: "Continue|Close|המחלקות" }
    timeout: 120000
- tapOn: { text: "Continue", optional: true }
- tapOn: { text: "Close", optional: true }
- extendedWaitUntil:
    visible: { text: "המחלקות" }
    timeout: 45000
- tapOn: ".*רשימה"
# A real little list: three lines, one of which (salmon) not every store stocks.
- tapOn: { id: "list-input" }
- inputText: "חלב 3%"
- tapOn: { text: ".*הוסף ״.*״ כמו שכתבתם" }
- tapOn: { id: "list-input" }
- inputText: "לחם אחיד"
- tapOn: { text: ".*הוסף ״.*״ כמו שכתבתם" }
- tapOn: { id: "list-input" }
- inputText: "פילה סלמון"
- tapOn: { text: ".*הוסף ״.*״ כמו שכתבתם" }
- tapOn: { id: "Done", optional: true }
- scroll
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "list-compare" }
    timeout: 10000
- tapOn: { id: "list-compare" }
- extendedWaitUntil:
    visible: { id: "answer-card" }
    timeout: 90000
- takeScreenshot: maestro/shots/compare-answer
- tapOn: { id: "answer-card" }
- takeScreenshot: maestro/shots/compare-answer-open
# Every store that delivers, each with a whole basket (docs/design/a-full-basket-everywhere.md).
# "עוד דרכים לקנות" now holds only splits — two stores, two deliveries — and a list with no split has
# none, so the section that is always there is the stores themselves.
- scrollUntilVisible:
    element: { text: "כל החנויות שמגיעות אליכם" }
    direction: DOWN
    timeout: 20000
- takeScreenshot: maestro/shots/compare-rows
- scrollUntilVisible:
    element: { id: "drive-card" }
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: maestro/shots/compare-drive
