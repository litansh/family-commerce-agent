# After a look at the store's sign-in: close it; the store must still read "not connected".
appId: com.litansh.kaniti
---
- tapOn: { id: "link-close" }
- waitForAnimationToEnd
# The list keeps its scroll position from the tap that opened the store: back to the top first.
- swipe: { direction: DOWN, duration: 300 }
- swipe: { direction: DOWN, duration: 300 }
- swipe: { direction: DOWN, duration: 300 }
- assertVisible: "החנויות המחוברות"
- runFlow:
    when:
      true: ${SCROLL}
    commands:
      - scrollUntilVisible:
          element: { id: "connect-${STORE}" }
          direction: DOWN
          timeout: 10000
          centerElement: true
          visibilityPercentage: 50
- assertVisible: { id: "connect-${STORE}" }
