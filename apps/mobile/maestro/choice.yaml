# The choice a line carries (docs/design/item-identity.md): variant cards in the add flow, the
# chip on every list line, the brand sheet behind it. Every state the design draws, in order,
# with a screenshot each — the add flow grouped, the flat list one tap under it, the chip, the
# sheet, and the chip again once a brand is chosen.
#
#     ./maestro/run.sh choice
#
# "ביצים" is the query on purpose: it is the one the catalogue actually collapses today (twelve
# products into seven cards). "חלב" comes back as twelve distinct products, so the screen shows
# the flat list and no toggle — the honest thing when grouping collapses nothing, and the reason
# the search width note is in the design doc.
appId: com.litansh.kaniti
---
- tapOn: { text: "Open", optional: true }
- extendedWaitUntil:
    visible: { text: "Continue|Close|המחלקות" }
    timeout: 120000
- tapOn: { text: "Continue", optional: true }
- tapOn: { text: "Close", optional: true }
- extendedWaitUntil:
    visible: { text: "המחלקות" }
    timeout: 45000
- tapOn: ".*רשימה"

# ── The add flow shows variants, not a wall of products.
- tapOn: { id: "list-input" }
- inputText: "ביצים"
- extendedWaitUntil:
    visible: { id: "variant-0" }
    timeout: 25000
- takeScreenshot: maestro/shots/choice-variants

# The flat list never goes away: one tap under the choices, and one tap back.
- tapOn: { text: ".*הצגת כל המוצרים.*" }
- assertVisible: { text: "חזרה לאפשרויות" }
- takeScreenshot: maestro/shots/choice-flat
- tapOn: { text: "חזרה לאפשרויות" }
- assertVisible: { id: "variant-0" }

# One tap puts the variant on the list, and it decides no brand for the family.
- tapOn: { id: "variant-0" }
- extendedWaitUntil:
    visible: { text: "כל מותג" }
    timeout: 10000
- takeScreenshot: maestro/shots/choice-chip

# ── The chip is the only place brand is ever asked.
- tapOn: { text: "כל מותג" }
- extendedWaitUntil:
    visible: { text: "איזה מותג?" }
    timeout: 25000
- assertVisible: { text: "הזול ביותר בכל חנות" }
- assertVisible: { id: "brand-any" }
- takeScreenshot: maestro/shots/choice-sheet

# Choosing a brand reads as a choice: the chip carries the brand's name afterwards, not "כל מותג".
# It is the barcode-less brands that used to fail here — the pin went on and the chip denied it.
- tapOn: { id: "brand-0" }
- tapOn: { id: "brand-save" }
- extendedWaitUntil:
    notVisible: { text: "איזה מותג?" }
    timeout: 10000
- assertNotVisible: { text: "כל מותג" }
- takeScreenshot: maestro/shots/choice-pinned

# And the way back is open: the same chip, "כל מותג" again, and the line keeps its own words.
- tapOn: { id: "choice-0" }
- tapOn: { id: "brand-any" }
- tapOn: { id: "brand-save" }
- extendedWaitUntil:
    visible: { text: "כל מותג" }
    timeout: 10000
- takeScreenshot: maestro/shots/choice-unpinned
