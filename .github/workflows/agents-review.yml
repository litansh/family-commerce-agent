name: agents review

# Every pull request gets the agents' review before a person's: the product-qa agent judges the
# change against docs/WHAT-WE-PROMISE.md and the agents' rules, with the diff, the tests and the
# labs it can run on a Linux runner (no simulator here; that is the daily run on the Mac).
# Needs the repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: ${{ !contains(github.event.pull_request.title, '[skip-agents]') }}
    runs-on: ubuntu-latest
    steps:
      # The key lives in AWS SSM (ops/secrets.sh), read here through the review role; a repository
      # secret ANTHROPIC_API_KEY, if one exists, wins. Without either, the review skips with a notice.
      - uses: aws-actions/configure-aws-credentials@v4
        id: aws
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/fca-github-review
          aws-region: eu-central-1
      - name: the agents' key
        id: key
        env:
          FROM_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          KEY="$FROM_SECRET"
          if [ -z "$KEY" ] && [ "${{ steps.aws.outcome }}" = "success" ]; then
            KEY=$(aws ssm get-parameter --name /fca/anthropic-key --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
            [ "$KEY" = "placeholder-set-by-ops-secrets" ] && KEY=""
          fi
          if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; echo "has=true" >> "$GITHUB_OUTPUT"; echo "value=$KEY" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::No agents' key (SSM /fca/anthropic-key via the review role, or the ANTHROPIC_API_KEY secret); the review is skipped."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.has == 'true'
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        if: steps.key.outputs.has == 'true'
        with: { node-version: '22', cache: npm }
      - if: steps.key.outputs.has == 'true'
        run: npm ci || npm install
      # The key may be an API key (sk-ant-api…) or a Claude subscription token from `claude setup-token` (sk-ant-oat…).
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.has == 'true' && !startsWith(steps.key.outputs.value, 'sk-ant-oat')
        with:
          anthropic_api_key: ${{ steps.key.outputs.value }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are Kaniti's product-qa agent reviewing pull request #${{ github.event.pull_request.number }}.
            Read CLAUDE.md, docs/WHAT-WE-PROMISE.md and .claude/agents/product-qa.md first.
            Then read the diff (git diff origin/main...HEAD) and judge it against the promises:
            which promise does it keep or touch, what could it break for a family, is every number
            still honest, does anything internal reach the screen, are there tests for the new rule.
            Run what you can here: `npm run typecheck`, `npm test`, `npm run check:recipes -w apps/mobile`,
            `npx tsc --noEmit -p apps/mobile/tsconfig.json`. Do not deploy and do not push.
            Post ONE review comment on the PR: a verdict line (approve / needs changes), the promises
            touched, findings with file and line, and what the simulator run on the Mac should look at.
            Keep it under 40 lines. Hebrew product words may stay in Hebrew.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git *),Bash(npm *),Bash(npx *),Bash(node *)" --max-turns 40'
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.has == 'true' && startsWith(steps.key.outputs.value, 'sk-ant-oat')
        with:
          claude_code_oauth_token: ${{ steps.key.outputs.value }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are Kaniti's product-qa agent reviewing pull request #${{ github.event.pull_request.number }}.
            Read CLAUDE.md, docs/WHAT-WE-PROMISE.md and .claude/agents/product-qa.md first.
            Then read the diff (git diff origin/main...HEAD) and judge it against the promises:
            which promise does it keep or touch, what could it break for a family, is every number
            still honest, does anything internal reach the screen, are there tests for the new rule.
            Run what you can here: `npm run typecheck`, `npm test`, `npm run check:recipes -w apps/mobile`,
            `npx tsc --noEmit -p apps/mobile/tsconfig.json`. Do not deploy and do not push.
            Post ONE review comment on the PR: a verdict line (approve / needs changes), the promises
            touched, findings with file and line, and what the simulator run on the Mac should look at.
            Keep it under 40 lines. Hebrew product words may stay in Hebrew.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git *),Bash(npm *),Bash(npx *),Bash(node *)" --max-turns 40'
